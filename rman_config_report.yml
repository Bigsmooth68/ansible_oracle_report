---
- name: Create rman configuration report
  hosts: all
  strategy: free
  gather_facts: true
  vars:
    oracle_home: /u01/app/oracle/product/19.0.0.0/dbhome_1
    out_file: "out/oracle_db_rman_config_report.csv"
    ansible_system: Linux

  tasks:

    - name: List process
      ansible.builtin.shell:
        cmd: 'ps ax | grep -v grep | grep ora_pmon'
      changed_when: false
      failed_when: false
      register: pmon_list

    - name: Check error
      ansible.builtin.fail:
        msg: "No Oracle PMON processes found"
      when: pmon_list.stdout == ""
    
    - name: Extract SID
      ansible.builtin.set_fact:
        sid_list: "{{ sid_list | default([]) + [ item | regex_search(' ora_pmon_(.+)$') | replace(' ora_pmon_','') | trim ] }}"
      with_items: "{{ pmon_list.stdout_lines }}"

    - name: Result file header
      ansible.builtin.lineinfile:
        path: "{{ out_file }}"
        insertbefore: BOF
        line: "SID;Hôte;rman_config"
        regexp: "^SID;Hôte;rman_config"
        create: true
      delegate_to: localhost
      # run_once: true

    - name: Boucle de requête
      include_tasks: "tasks/rman_config.yml"
      with_items: "{{ sid_list }}"
      loop_control:
        loop_var: oracle_sid
      register: result_list
      ignore_errors: True
